[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncc"
version = "0.1.0"
description = "Normative Construct Compiler — mathematical proxies for normative concepts"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ncc = "ncc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ncc"]
